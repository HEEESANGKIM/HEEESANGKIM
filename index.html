<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Heesang Kim | AI Systems &amp; Autonomous Driving</title>
    <meta
      name="description"
      content="Personal portfolio of Heesang Kim, a Computer Science student interested in AI systems, autonomous systems, perception, and software-defined mobility."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Heesang Kim | AI Systems &amp; Autonomous Driving" />
    <meta
      property="og:description"
      content="Computer Science, AI systems, and autonomous systems. The research and engineering portfolio of Heesang Kim."
    />
    <meta property="og:locale" content="en_US" />
    <meta name="theme-color" content="#0b1018" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      (() => {
        let theme, language;
        try {
          theme = localStorage.getItem('hk-theme');
          language = localStorage.getItem('hk-language');
        } catch {}
        const dark = theme !== 'light';
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.lang = language === 'ko' ? 'ko' : 'en';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#0b1018' : '#f8f9fc';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >This portfolio needs JavaScript. Visit
      <a href="https://github.com/HEEESANGKIM">Heesang Kim on GitHub</a>.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
